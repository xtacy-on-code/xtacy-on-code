name: game

on:
  issues:
    types: [opened]
  schedule:
    - cron: "30 0 * * *" # 6 a.m. IST: he wakes up a little worse
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# One run at a time. Every run sweeps all open game issues, so a skipped run loses nothing.
concurrency:
  group: game
  cancel-in-progress: false

jobs:
  play:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'game|')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - run: node .github/scripts/game.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/state.json
          git diff --cached --quiet || git commit -m "tamagotchi: update"
          git push
